name: ci
permissions: read-all

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      # Runs `dart analyze` + a `dart format` check and surfaces findings as
      # GitHub annotations (run summary + inline on the PR). fail-on-infos/
      # warnings keep the strictness of the old `flutter analyze` gate;
      # line-length matches the repo's configured page_width (120). Pinned to a
      # commit SHA for supply-chain safety.
      - name: Analyze
        uses: zgosalvez/github-actions-analyze-dart@5ca39053dd1eba33fa2c6191215a6f1642a4575e # v3
        with:
          fail-on-infos: true
          fail-on-warnings: true
          line-length: 120
      - name: Test with coverage
        run: |
          set -e
          for p in packages/*/; do
            if [ -d "${p}test" ]; then
              echo "== flutter test --coverage ${p} =="
              (cd "$p" && flutter test --coverage)
            fi
          done
      - name: Merge coverage into a single lcov (repo-relative paths)
        run: |
          set -e
          : > coverage.lcov
          for p in packages/*/; do
            f="${p}coverage/lcov.info"
            if [ -f "$f" ]; then
              # rewrite package-relative source paths (lib/src/...) to repo-relative
              # (packages/<pkg>/lib/src/...) so Coveralls maps them to the repo,
              # and drop generated files (*.g.dart, e.g. pigeon's messages.g.dart)
              sed "s#^SF:#SF:${p}#" "$f" \
                | awk '/^SF:/ { drop = ($0 ~ /\.g\.dart$/) } !drop' >> coverage.lcov
            fi
          done
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.lcov
          # don't fail CI on a coverage-upload hiccup (e.g. before the repo is
          # enabled on coveralls.io) — remove once Coveralls is confirmed working
          fail-on-error: false
